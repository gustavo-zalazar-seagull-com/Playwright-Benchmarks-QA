name: Falabella Benchmark

on:
  workflow_dispatch:          # run manually from the Actions tab
    inputs:
      environment:
        description: Environment to benchmark
        type: choice
        required: true
        default: All
        options:
          - All
          - Prod
          - Sand
          - QAT1
  schedule:
    - cron: '0 6 * * *'     # every day at 06:00 UTC

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BENCHMARK_ENVIRONMENT: ${{ inputs.environment || 'All' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Verify runner Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright browsers (Non-Linux)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Run Prod benchmark tests
        id: run_prod
        if: env.BENCHMARK_ENVIRONMENT == 'All' || env.BENCHMARK_ENVIRONMENT == 'Prod'
        continue-on-error: true
        env:
          FALABELLA_PROD_USER: ${{ secrets.FALABELLA_PROD_USER }}
          FALABELLA_PROD_PASS: ${{ secrets.FALABELLA_PROD_PASS }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/prod
        run: npx playwright test tests/falabellaBenchmarksProd.js

      - name: Run Sand benchmark tests
        id: run_sand
        if: env.BENCHMARK_ENVIRONMENT == 'All' || env.BENCHMARK_ENVIRONMENT == 'Sand'
        continue-on-error: true
        env:
          FALABELLA_SAND_USER: ${{ secrets.FALABELLA_SAND_USER }}
          FALABELLA_SAND_PASS: ${{ secrets.FALABELLA_SAND_PASS }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/sand
        run: npx playwright test tests/falabellaBenchmarksSand.js

      - name: Run QAT1 benchmark tests
        id: run_qat1
        if: env.BENCHMARK_ENVIRONMENT == 'All' || env.BENCHMARK_ENVIRONMENT == 'QAT1'
        continue-on-error: true
        env:
          FALABELLA_QAT1_USER: ${{ secrets.FALABELLA_QAT1_USER }}
          FALABELLA_QAT1_PASS: ${{ secrets.FALABELLA_QAT1_PASS }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/qat1
        run: npx playwright test tests/falabellaBenchmarksQAT1.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload benchmark results HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if any benchmark failed
        if: always()
        shell: powershell
        run: |
          $outcomes = [ordered]@{
            Prod = "${{ steps.run_prod.outcome }}"
            Sand = "${{ steps.run_sand.outcome }}"
            QAT1 = "${{ steps.run_qat1.outcome }}"
          }
          foreach ($environment in $outcomes.Keys) {
            Write-Host "$environment outcome: $($outcomes[$environment])"
            if ($env:BENCHMARK_ENVIRONMENT -eq 'All' -or $env:BENCHMARK_ENVIRONMENT -eq $environment) {
              if ($outcomes[$environment] -ne 'success') {
                Write-Host "$environment benchmark did not succeed."
                exit 1
              }
            }
          }
