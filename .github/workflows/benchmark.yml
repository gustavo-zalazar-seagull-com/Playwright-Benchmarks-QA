name: Falabella Benchmark

on:
  workflow_dispatch:          # run manually from the Actions tab
  schedule:
    - cron: '30 6 * * *'     # every day at 06:30 UTC (adjust as needed)

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright browsers (Non-Linux)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Run Prod benchmark tests
        id: run_prod
        continue-on-error: true
        env:
          FALABELLA_PROD_USER: ${{ secrets.FALABELLA_PROD_USER }}
          FALABELLA_PROD_PASS: ${{ secrets.FALABELLA_PROD_PASS }}
        run: npx playwright test tests/falabellaBenchmarksProd.js

      - name: Run Sand benchmark tests
        id: run_sand
        continue-on-error: true
        env:
          FALABELLA_SAND_USER: ${{ secrets.FALABELLA_SAND_USER }}
          FALABELLA_SAND_PASS: ${{ secrets.FALABELLA_SAND_PASS }}
        run: npx playwright test tests/falabellaBenchmarksSand.js

      - name: Run QAT1 benchmark tests
        id: run_qat1
        continue-on-error: true
        env:
          FALABELLA_QAT1_USER: ${{ secrets.FALABELLA_QAT1_USER || secrets.FALABELLA_PROD_USER }}
          FALABELLA_QAT1_PASS: ${{ secrets.FALABELLA_QAT1_PASS || secrets.FALABELLA_PROD_PASS }}
        run: npx playwright test tests/falabellaBenchmarksQAT1.js

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload benchmark results HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if any benchmark failed
        if: always()
        shell: pwsh
        run: |
          $prod = "${{ steps.run_prod.outcome }}"
          $sand = "${{ steps.run_sand.outcome }}"
          $qat1 = "${{ steps.run_qat1.outcome }}"
          Write-Host "Prod outcome: $prod"
          Write-Host "Sand outcome: $sand"
          Write-Host "QAT1 outcome: $qat1"
          if ($prod -ne 'success' -or $sand -ne 'success' -or $qat1 -ne 'success') {
            Write-Host 'At least one benchmark environment failed.'
            exit 1
          }
